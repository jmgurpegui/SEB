name: Build Android APK and Deploy Cloud Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-release"
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Generar Keystore de Firma Release
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "Generando keystore de producción para firma de APK..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias educamadrid \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass educamadrid \
              -keypass educamadrid \
              -dname "CN=EducaMadrid SEB Client, OU=Educacion, O=Comunidad de Madrid, C=ES"
          fi

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar pruebas unitarias
        run: ./gradlew test --stacktrace

      - name: Compilar APK y AAB Bundle en modo Release
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: educamadrid
          KEY_ALIAS: educamadrid
          KEY_PASSWORD: educamadrid

      - name: Preparar artefactos educamadrid-seb.apk y educamadrid-seb-playstore.aab
        run: |
          mkdir -p dist
          APK_PATH=$(ls app/build/outputs/apk/release/*-release.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          echo "APK generado encontrado en: $APK_PATH"
          cp "$APK_PATH" dist/educamadrid-seb.apk

          AAB_PATH=$(ls app/build/outputs/bundle/release/*-release.aab app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n 1)
          echo "AAB Bundle generado encontrado en: $AAB_PATH"
          cp "$AAB_PATH" dist/educamadrid-seb-playstore.aab
          ls -lh dist/

      - name: Publicar en GitHub Releases (tag 'latest')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "EducaMadrid SEB Client - Última Versión Oficial"
          body: |
            ### 📱 EducaMadrid SEB Client - Descarga Oficial para Android (BYOD)
            
            Versión oficial compilada, firmada y optimizada en la nube mediante GitHub Actions.
            
            - **Archivo APK:** `educamadrid-seb.apk` (Instalación directa en dispositivo)
            - **Bundle Play Store:** `educamadrid-seb-playstore.aab` (Para Google Play Console)
            - **Compatibilidad:** Android 8.0 a Android 14+ (API 26-34)
            - **Protocolo:** Safe Exam Browser (SEB) v3.7.1
            - **Seguridad:** Kiosk (Screen Pinning), anti-emulador, anti-capturas (`FLAG_SECURE`), PIN dinámico de sesión, whitelist de dominios y desbloqueo automático de examen entregado.
            
            *Enlace directo de descarga permanente para alumnos y docentes.*
          files: |
            dist/educamadrid-seb.apk
            dist/educamadrid-seb-playstore.aab
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefactos web estáticos (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
